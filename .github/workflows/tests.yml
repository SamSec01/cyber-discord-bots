# Runs the test suite whenever you push code, so you find out quickly if a
# change broke something — before the scheduled bots run it for real.
name: Tests

on:
  push:
    paths-ignore: ["state/**"]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
